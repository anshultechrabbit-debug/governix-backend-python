name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governix
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/governix
      JWT_SECRET: ci-secret-not-used-in-tests-but-must-be-32-chars
      APP_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Unit tests
        run: pytest app/tests/unit -q

      - name: Integration and security tests
        run: pytest app/tests -q

      - name: Migrations match models
        run: |
          alembic upgrade head
          alembic check

  acceptance:
    # The acceptance suite needs a real LLM and a real indexed corpus, so it is
    # opt-in via a repository secret rather than running on every push. Set
    # ACCEPTANCE=1 to enable it; the pass-rate floor turns a quality regression
    # into a red build instead of a number in a file nobody opens.
    if: ${{ vars.ACCEPTANCE == '1' }}
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: ${{ secrets.ACCEPTANCE_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JWT_SECRET: ci-secret-not-used-in-tests-but-must-be-32-chars

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run acceptance suite
        run: python run_suite.py --min-pass-rate ${{ vars.ACCEPTANCE_MIN_PASS_RATE || '90' }}
